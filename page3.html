<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聊天界面</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background-color: #ededed;
    font-family: Arial, sans-serif;
}

/* 聊天窗口 */
.chat-container {
    max-width: 500px;
    height: 100vh;
    margin: auto;
    background-color: #ededed;
    display: flex;
    flex-direction: column;
}

/* 顶部 */
.chat-header {
    height: 55px;
    background-color: #f7f7f7;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    position: relative;
}

/* 箭头 */
.black-button {
    position: absolute;
    left: 15px;
    top: 5px;
    height: 45px;
    border: none;
    background-color: none;
    font-size: 32px;
    cursor: pointer;
    color: #222;
}

/* 聊天内容区域 */
.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

/* 消息 */
.message {
    display: flex;
    margin-bottom: 20px;
    align-items: flex-start;
}

/* 自己的消息 */
.message.self {
    justify-content: flex-end;
}

/* 头像 */
.avatar {
    width: 40px;
    height: 40px;
    border-radius: 5px;
    object-fit: cover;
}

/* 聊天气泡 */
.bubble {
    max-width: 70%;
    padding: 10px 13px;
    border-radius: 5px;
    font-size: 15px;
    line-height: 1.5;
    margin: 0 10px;
    word-break: break-word;
}

/* 对方 */
.message.other .bubble {
    background-color: white;
}

/* 自己 */
.message.self .bubble {
    background-color: #95ec69;
}

/* 底部输入区域 */
.chat-input {
    min-height: 65px;
    padding: 10px;
    background-color: #f7f7f7;
    border-top: 1px solid #ddd;
    display: flex;
    gap: 10px;
    align-items: center;
}

.chat-input input {
    flex: 1;
    height: 40px;
    border: none;
    border-radius: 5px;
    padding: 10px;
    font-size: 15px;
    outline: none;
}

.chat-input button {
    height: 40px;
    padding: 0 18px;
    border: none;
    border-radius: 5px;
    background-color: #95ec69;
    cursor: pointer;
    font-size: 14px;

}

.chat-avatar {
    width: 40px;
    height: 40px;
    min-width: 40px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin-right: 10px;
}

/* 转账卡片 */
.transfer-card {
    width: 220px;
    background-color: #f09b38;
    color: white;
    border-radius: 8px;
    padding: 15px;
    margin: 0 10px;
}

.transfer-top {
    display: flex;
    align-items: center;
    gap: 10px;
}

.transfer-icon {
    font-size: 30px;
}

.transfer-amount {
    font-size: 23px;
    font-weight: bold;
}

.transfer-desc {
    font-size: 13px;
    margin-top: 5px;
}

.transfer-bottom {
    border-top: 1px solid rgba(255,255,255,0.3);
    margin-top: 15px;
    padding-top: 8px;
    font-size: 12px;
}

</style>
</head>

<body>

<div class="chat-container">

  <!-- 顶部名字 -->
<div class="chat-header">
    <button class="black-button" onclick="history.back()">‹</button>
    <span>妈妈</span>
</div>

<!-- 聊天记录 -->
<div class="chat-box" id="chat-box">

    <!-- 妈妈的消息 -->
    <div class="message other">
        <div class="chat-avatar">🐶</div>
        <div class="bubble">儿子 有时间回来看看</div>
    </div>

    <div class="message other">
        <div class="chat-avatar">🐶</div>
        <div class="bubble">
            有什么烦心事记得告诉给妈听啊
        </div>
    </div>

    <!-- 自己的消息 -->
    <div class="message self">
        <div class="bubble">
            知道了 妈 有时间就回去了
        </div>
        <img class="avatar"
        src="https://i.imgs.ovh/2026/11/18/08bbf4715b23fefb8e12b42ec780a13e.jpg">
    </div>

    <div class="message self">
        <div class="bubble">
            对了 妈 最近公司那边出了问题 手头有点紧
        </div>
        <img class="avatar"
        src="https://i.imgs.ovh/2026/11/18/08bbf4715b23fefb8e12b42ec780a13e.jpg">
    </div>

    <div class="message self">
        <div class="bubble">
            你看看能不能。。。。
        </div>
        <img class="avatar"
        src="https://i.imgs.ovh/2026/11/18/08bbf4715b23fefb8e12b42ec780a13e.jpg">
    </div>

    <!-- 妈妈转账：已收款 -->
    <div class="message other">

        <div class="chat-avatar">🐶</div>

        <div class="transfer-card">

            <div class="transfer-top">
                <span class="transfer-icon">￥</span>

                <div>
                    <div class="transfer-amount">¥500.00</div>
                    <div class="transfer-desc">转账给你</div>
                </div>
            </div>

            <div class="transfer-bottom">
                ✓ 已收款
            </div>

        </div>

    </div>
<div class="message other">
        <div class="chat-avatar">🐶</div>
        <div class="bubble">
            儿子 钱给你转过去了
        </div>
    </div>

</div>

<!-- 输入框 -->
<div class="chat-input">
    <input id="message-input"
    type="text"
    placeholder="发送消息...">

    <button type="button">发送</button>
</div>
