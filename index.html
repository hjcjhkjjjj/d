<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeChat</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background-color: #1c1c1c;
    color: #eeeeee;
    font-family: Arial, sans-serif;
}
/* 整体 */
.wechat-container {
    max-width: 500px;
    min-height: 100vh;
    margin: auto;
    background-color: #1c1c1c;
    display: flex;
    flex-direction: column;
}
/* 顶部时间栏 */
.status-bar {
    height: 65px;
    padding: 20px 25px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 17px;
    font-weight: bold;
    background-color: #111111;
}
.status-icons {
    font-size: 17px;
    letter-spacing: 2px;
}
/* 顶部标题 */
.top-header {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background-color: #111111;
}
.top-header span {
    font-size: 27px;
    cursor: pointer;
}
.top-header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: bold;
}
/* 搜索框 */
.search-area {
    padding: 10px 15px 15px;
    background-color: #111111;
}
.search-box {
    height: 50px;
    background-color: #252525;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 17px;
    gap: 10px;
}
.search-box input {
    width: 150px;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
}
/* 聊天列表 */
.chat-list {
    flex: 1;
    overflow-y: auto;
}
/* 每个聊天 */
.chat-item {
    height: 140px;
    padding: 20px 18px;
    display: flex;
    align-items: flex-start;
    cursor: pointer;
    position: relative;
}
.chat-item:active {
    background-color: #303030;
}
/* 头像 */
.chat-avatar {
    width: 70px;
    height: 70px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background-color: #444;
}
/* 文字区域 */
.chat-content {
    flex: 1;
    min-width: 0;
    margin-left: 15px;
    padding-top: 3px;
}
.chat-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
}
.chat-name {
    font-size: 19px;
    font-weight: bold;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
.chat-time {
    font-size: 13px;
    color: #555;
    white-space: nowrap;
}
.chat-preview {
    margin-top: 12px;
    color: #777;
    font-size: 15px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}
/* 分割线 */
.chat-item::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 103px;
    right: 0;
    height: 1px;
    background-color: #303030;
}
/* 底部导航 */
.bottom-nav {
    height: 85px;
    background-color: #222222;
    border-top: 1px solid #333;
    display: flex;
    justify-content: space-around;
    align-items: center;
}
.nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    color: #aaaaaa;
    font-size: 13px;
    cursor: pointer;
}
.nav-icon {
    font-size: 25px;
}
.nav-item.active {
    color: #07c160;
}
/* 底部手机横条 */
.home-indicator {
    height: 22px;
    background-color: #222222;
    display: flex;
    justify-content: center;
    align-items: center;
}
.home-indicator div {
    width: 135px;
    height: 5px;
    border-radius: 10px;
    background-color: white;
}
</style>
</head>

<script>
// 自动获取设备当前时间
function updateTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    document.getElementById("current-time").textContent =
        hours + ":" + minutes;
}
updateTime();
setInterval(updateTime, 1000);
</script>
