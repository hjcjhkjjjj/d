<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WeChat</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    background-color: #f5f5f5;
    color: #222;
    font-family: Arial, sans-serif;
}
/* 整体 */
.wechat-container {
    max-width: 500px;
    min-height: 100vh;
    margin: auto;
    background-color: #fff;
    display: flex;
    flex-direction: column;
}
/* 顶部时间栏 */
.status-bar {
    height: 65px;
    padding: 20px 25px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 17px;
    font-weight: bold;
    background-color: #fff;
    color: #111;
}
.status-icons {
    font-size: 17px;
    letter-spacing: 2px;
}
/* 顶部标题 */
.top-header {
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    background-color: #fff;
}
.top-header span {
    font-size: 27px;
    cursor: pointer;
    color: #222;
}
.top-header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: bold;
    color: #222;
}
/* 搜索框 */
.search-area {
    padding: 10px 15px 15px;
    background-color: #fff;
}
.search-box {
    height: 50px;
    background-color: #f2f2f2;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 17px;
    gap: 10px;
}
.search-box input {
    width: 150px;
    border: none;
    outline: none;
    background: transparent;
    color: #333;
    font-size: 16px;
}
/* 聊天列表 */
.chat-list {
    flex: 1;
    overflow-y: auto;
    background-color: #fff;
}
/* 每个聊天 */
.chat-item {
    height: 140px;
    padding: 20px 18px;
    display: flex;
    align-items: flex-start;
    cursor: pointer;
    position: relative;
    background-color: #fff;
}
.chat-item:active {
    background-color: #f5f5f5;
}
/* 头像 */
.chat-avatar {
    width: 70px;
    height: 70px;
    border-radius: 10px;
    object-fit: cover;
    flex-shrink: 0;
    background-color: #eee;
}
/* 文字区域 */
